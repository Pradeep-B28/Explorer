<body>
  <header class="site-header">
    <div class="site-header-bar"></div>
    <div class="site-header-inner">
      <a href="#/" class="site-logo-link" aria-label="Explorer Home">
        <img src="assets/logo.png" alt="Wrench Wise" class="site-logo">
        <span class="site-logo-text">Explorer</span>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle-btn">
        <span id="theme-label">Switch to dark theme</span>
      </button>
    </div>

  <main class="site-main" id="app-root"></main>

      </p>
      <p class="site-footer-legal">

      </p>
    </div>
  </footer>

  <script type="module">
    // Safe theme initialization and switching (Hard Rule 5)
    const toggleBtn = document.getElementById("theme-toggle");
    const themeLabel = document.getElementById("theme-label");

    function getSavedTheme() {
      try {
        return localStorage.getItem("tea-theme");
      } catch (e) {
        return null;
      }
    }

    function saveTheme(theme) {
      try {
        localStorage.setItem("tea-theme", theme);
      } catch (e) {
        // Storage blocked, do nothing
      }
    }

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        if (themeLabel) themeLabel.textContent = "Switch to light theme";
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        if (themeLabel) themeLabel.textContent = "Switch to dark theme";
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const themeParam = urlParams.get("theme");

    if (themeParam === "dark" || themeParam === "light") {
      applyTheme(themeParam);
    } else {
      const savedTheme = getSavedTheme();
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }
    }

    if (urlParams.get("test") === "1") {
      import("./js/selftest.js").then((mod) => {
        const root = document.getElementById("app-root");
        if (root) mod.renderSelfTestDOM(root);
      });
    } else {
      import("./js/main.js");
    }

    if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
        saveTheme(nextTheme);
      });
    }
  </script>
</body>
</html>
