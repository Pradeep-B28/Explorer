<body>

      <div class="site-header-right">
        <button type="button" id="site-share-btn" class="site-share-btn" aria-label="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Share</span>

        <button type="button" id="theme-toggle" class="site-theme-btn" aria-label="Switch to dark theme" title="Switch to dark theme">

  <script type="module">
    // Safe theme initialization and switching (Hard Rule 5)
    const toggleBtn = document.getElementById("theme-toggle");
    const shareBtn = document.getElementById("site-share-btn");

    const MOON_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const SUN_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;

    function getSavedTheme() {
      try {
        return localStorage.getItem("tea-theme");
      } catch (e) {
        return null;
      }
    }

    function saveTheme(theme) {
      try {
        localStorage.setItem("tea-theme", theme);
      } catch (e) {
        // Storage blocked, do nothing
      }
    }

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        if (toggleBtn) {
          toggleBtn.setAttribute("aria-label", "Switch to light theme");
          toggleBtn.setAttribute("title", "Switch to light theme");
          toggleBtn.innerHTML = SUN_SVG;
        }
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        if (toggleBtn) {
          toggleBtn.setAttribute("aria-label", "Switch to dark theme");
          toggleBtn.setAttribute("title", "Switch to dark theme");
          toggleBtn.innerHTML = MOON_SVG;
        }
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const themeParam = urlParams.get("theme");

    if (themeParam === "dark" || themeParam === "light") {
      applyTheme(themeParam);
    } else {
      const savedTheme = getSavedTheme();
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }
    }

    if (urlParams.get("test") === "1") {
      import("./js/selftest.js").then((mod) => {
        const root = document.getElementById("app-root");
        if (root) mod.renderSelfTestDOM(root);
      });
    } else {
      import("./js/main.js");
    }

    if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
        saveTheme(nextTheme);
      });
    }

    if (shareBtn) {
      shareBtn.addEventListener("click", () => {
        import("./js/ui/share.js").then((m) => m.shareSite());
      });
    }
  </script>
</body>
</html>
